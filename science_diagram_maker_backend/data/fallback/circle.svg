<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Parts of a circle</title>
  <rect x="1" y="1" width="798" height="498" fill="#f8fafc"/>
  <text x="400" y="62" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a">Parts of a circle</text>
  <circle cx="260" cy="245" r="130" fill="#ffffff" stroke="#15645d" stroke-width="4"/>
  <line x1="130" y1="245" x2="390" y2="245" stroke="#2563eb" stroke-width="5"/>
  <line x1="260" y1="245" x2="260" y2="115" stroke="#b45309" stroke-width="5">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="364" y1="167" x2="445" y2="143" stroke="#15645d" stroke-width="2"/>
  <circle cx="260" cy="245" r="6" fill="#0f172a"/>
  <text x="276" y="182" font-family="monospace" font-size="16" font-weight="bold" fill="#92400e">Radius</text>
  <text x="278" y="270" font-family="monospace" font-size="16" fill="#0f172a">Centre</text>
  <text x="260" y="297" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#1d4ed8">Diameter</text>
  <text x="455" y="145" font-family="monospace" font-size="17" font-weight="bold" fill="#15645d">Circumference</text>
  <text x="455" y="171" font-family="monospace" font-size="15" fill="#334155">Distance around the circle.</text>
  <rect x="445" y="219" width="295" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="592" y="278" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#0f172a">Diameter = 2 × radius</text>
  <text x="400" y="438" text-anchor="middle" font-family="monospace" font-size="16" fill="#334155">The diameter passes through the centre.</text>
</svg>
