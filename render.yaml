services:
  - type: web
    name: science-diagram-maker-api
    runtime: python
    plan: free
    rootDir: science_diagram_maker_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
